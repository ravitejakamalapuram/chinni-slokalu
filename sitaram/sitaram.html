<script>
__LIB__
__SCENES__
document.getElementById('scn').insertAdjacentHTML('afterbegin', SC.svg);
const D = __DATA__;
const T = D.duration, C = D.counts;
const tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const NS = 'http://www.w3.org/2000/svg';
// ---------- ambient loops (deterministic) ----------
$$('.sway').forEach((e, i) => tl.fromTo(e, { rotation: -2 }, { rotation: 2, transformOrigin: '50% 100%', duration: 1.6 + (i % 3) * 0.3, yoyo: true, repeat: Math.ceil(T / 1.6), ease: 'sine.inOut' }, 0));
$$('.twk').forEach((e, i) => tl.fromTo(e, { opacity: 1 }, { opacity: 0.3, duration: 0.8 + (i % 4) * 0.25, yoyo: true, repeat: Math.ceil(T / 0.8), ease: 'sine.inOut' }, (i % 5) * 0.2));

$$('.flick').forEach((e, i) => tl.fromTo(e, { scaleY: 0.9 }, { scaleY: 1.1, transformOrigin: '50% 100%', duration: 0.25, yoyo: true, repeat: Math.ceil(T / 0.25), ease: 'sine.inOut' }, (i % 4) * 0.06));
$$('.wave').forEach((e, i) => tl.fromTo(e, { x: 0 }, { x: -180, duration: 3 + i, repeat: Math.ceil(T / 3), ease: 'none' }, 0));

const mala = $('#mala'), beads = [];
const bx = i => 70 + i * (940 / 107), by = i => 1705 + 90 * Math.pow((bx(i) - 540) / 470, 2) * -1 + 90;
let cord = `<path d="M${bx(0)} ${by(0)} ${[...Array(108)].map((_, i) => `L${bx(i).toFixed(1)} ${by(i).toFixed(1)}`).join(' ')}" stroke="#8A5A2B" stroke-width="3" fill="none"/>`;
mala.innerHTML = cord + [...Array(108)].map((_, i) => `<circle id="b${i}" cx="${bx(i).toFixed(1)}" cy="${by(i).toFixed(1)}" r="6.5" fill="#6B4423" stroke="#2B1407" stroke-width="2"/>`).join('') +
  `<g transform="translate(540 1885)"><path d="M0 -12 L12 0 L0 12 L-12 0Z" fill="#E63946" stroke="#2B1407" stroke-width="3"/></g>`;
C.forEach((t, i) => {
  tl.set('#num', { innerHTML: i + 1 }, t);
  tl.fromTo('#cam', { scale: 1.03 }, { scale: 1, transformOrigin: '50% 60%', duration: 0.35, ease: 'power2.out' }, t);
  tl.fromTo('#num', { scale: 1.35 }, { scale: 1, duration: 0.35, ease: 'back.out(3)' }, t);
  tl.to(`#b${i}`, { attr: { r: 9, fill: '#FFD23F' }, duration: 0.15 }, t);
  tl.to(`#b${i}`, { attr: { r: 7 }, duration: 0.3 }, t + 0.15);
  if ((i + 1) % 27 === 0 && i < 107) { tl.fromTo('#flash', { opacity: 0.45 }, { opacity: 0, duration: 0.6 }, t); burst(t, 540, 900, 18); }
});
// floating Rama words and fireflies
function addFx(svg) { const g = document.createElementNS(NS, 'g'); g.innerHTML = svg; $('#fx').appendChild(g); return g; }
for (let k = 0; k < 40; k++) { const t = 0.5 + k * (T - 3) / 40, x = 120 + rnd() * 840, y = 1350 + rnd() * 200;
  const g = addFx(`<text x="0" y="0" font-family="Baloo Tammudu 2" font-weight="800" font-size="${44 + rnd() * 24}" fill="#FFE08A" text-anchor="middle">రామ</text>`);
  tl.fromTo(g, { x, y, opacity: 0 }, { y: y - 650, opacity: 0.0, duration: 6, ease: 'none' }, t);
  tl.to(g, { opacity: 0.35, duration: 1.5, yoyo: true, repeat: 1 }, t + 0.5); }
for (let k = 0; k < 26; k++) { const x = rnd() * 1080, y = 700 + rnd() * 900, g = addFx(`<circle r="5" fill="#FFF3A0"/>`);
  tl.fromTo(g, { x, y, opacity: 0 }, { x: x + 60 - rnd() * 120, y: y - 80, opacity: 0.9, duration: 2.5 + rnd() * 2, yoyo: true, repeat: Math.ceil(T / 3), ease: 'sine.inOut' }, rnd() * 3); }
function burst(t, x, y, n, kind = 'marigold') { for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2, r = 220 + rnd() * 200;
  const g = addFx(`<g>${ST.SH[i % 2 ? 'marigold' : 'spark']}</g>`);
  tl.fromTo(g, { x, y, scale: 0.3, opacity: 1 }, { x: x + Math.cos(a) * r, y: y + Math.sin(a) * r + 160, scale: 0.8, opacity: 0, rotation: 200, duration: 1.6, ease: 'power2.out' }, t); } }
function rain(t, dur, n = 24) { for (let i = 0; i < n; i++) { const x = rnd() * 1080, g = addFx(`<g>${ST.SH.marigold}</g>`), t1 = t + rnd() * dur * 0.6;
  tl.fromTo(g, { x, y: 560, opacity: 1, rotation: 0, scale: 0.7 }, { x: x + 80 - rnd() * 160, y: 1600, rotation: 360, opacity: 0, duration: 2.6 + rnd(), ease: 'none' }, t1); } }
// ---------- scenes with camera moves and parallax ----------
const N = SC.cap.length, S0 = SC.len.reduce((o, n) => (o.push(o[o.length - 1] + n), o), [0]);
SC.cap.forEach(([te, en], i) => {
  const k = SC.ids[i], a = i === 0 ? 0 : C[S0[i]] - 0.3, b = i === N - 1 ? T : C[S0[i + 1]] - 0.3, m = a + (b - a) * 0.5;
  tl.set(`#sc${k}`, { opacity: 1 }, a); if (i) tl.fromTo(`#sc${k}`, { opacity: 0 }, { opacity: 1, duration: 0.25 }, a);
  if (i < N - 1) tl.set(`#sc${k}`, { opacity: 0 }, b + 0.26); else tl.set('#scn', { scale: 1.1, x: 0, transformOrigin: '50% 72%' }, a);
  const z = i % 2 ? [1.22, 1.1] : [1.1, 1.22];
  if (i < N - 1) tl.fromTo('#scn', { scale: z[0], x: i % 3 === 0 ? -25 : 25 }, { scale: z[1], x: i % 3 === 0 ? 25 : -25, transformOrigin: '50% 72%', duration: b - a, ease: 'sine.inOut' }, a);
  tl.fromTo(`#sc${k} .far`, { x: 30 }, { x: -30, duration: b - a, ease: 'none' }, a);
  tl.fromTo(`#sc${k} .near`, { x: 80 }, { x: -80, duration: b - a, ease: 'none' }, a);
  const cap = document.createElement('div'); cap.className = 'abs'; cap.style.cssText = 'left:0;top:0;width:900px;opacity:0';
  cap.innerHTML = `<div><span class="te">${te}</span><span class="en">${en}</span></div>`; $('#cap').appendChild(cap);
  tl.fromTo(cap, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: 'back.out(2)' }, a + 0.15);
  tl.to(cap, { opacity: 0, duration: 0.2 }, i === N - 1 ? C[107] + 0.2 : b - 0.15);
  SC.act[i](tl, a, m, b);
});
// ---------- 108 complete ----------
const tE = C[107] + 0.6;
tl.fromTo('#flash', { opacity: 0.8 }, { opacity: 0, duration: 1 }, C[107]);
tl.to(['#top', '#cnt'], { opacity: 0, duration: 0.4 }, C[107] + 0.3);
tl.fromTo('#end', { opacity: 0 }, { opacity: 1, duration: 0.5 }, tE);
tl.fromTo('#end .big', { scale: 0.3 }, { scale: 1, duration: 0.7, ease: 'back.out(2.5)' }, tE);
tl.fromTo('#end .cmt', { y: 200 }, { y: 0, duration: 0.6, ease: 'back.out(2)' }, tE + 0.8);
burst(C[107], 540, 800, 28); rain(C[107] + 0.2, T - C[107] - 1, 40);
tl.to({}, { duration: 0 }, T);
window.__timelines = window.__timelines || {}; window.__timelines['sitaram'] = tl;
